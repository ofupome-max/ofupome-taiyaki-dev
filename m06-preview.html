    title(767,130,'ゲーム内110px',20);
    // Same-size transparent canvases. All images share exactly the same origin.
    const addPlayer=(centerX,centerY,fishWidth)=>{
      const commonAssetWidth=627;       // prepared PNG full canvas width
      const fishPixelWidth=1246/2;      // approved fish alpha silhouette width
      const s=fishWidth/fishPixelWidth;  // width of the actual visible fish
      const group=this.add.container(centerX,centerY);
      group.add(this.add.image(0,0,'m06-steam'));
      group.add(this.add.image(0,0,'m06-machine'));
      group.add(this.add.image(0,0,'m06-normal'));
      group.setScale(s);
      return group;
    };
